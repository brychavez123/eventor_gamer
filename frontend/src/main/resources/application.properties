spring.application.name=eventos-gamer-frontend
server.port=8081
# La aplicación queda publicada en https://[IP]/eventos
server.servlet.context-path=/eventos

# URL de la capa backend (en Docker: http://backend:8080)
backend.url=${BACKEND_URL:http://localhost:8080}

# URL pública del sitio, usada en los enlaces para compartir en redes sociales.
# Se configura (no se toma del header Host, que el cliente puede manipular).
app.url-publica=${URL_PUBLICA:https://localhost/eventos}

# Subida de fotos (5 MB) y videos (20 MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Respeta X-Forwarded-* enviados por nginx (redirecciones correctas detrás del proxy)
server.forward-headers-strategy=native

# --- Sesión (A07/A02): cookie HttpOnly + SameSite + Secure (solo viaja por HTTPS), solo por cookie (nunca ;jsessionid en la URL) ---
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=EVENTOSSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=true

# --- Endurecimiento (A05): sin detalles técnicos en errores ---
app.seguridad.endurecida=true
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

spring.thymeleaf.cache=true
logging.level.org.springframework.security=WARN
