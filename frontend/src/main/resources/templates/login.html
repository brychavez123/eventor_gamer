<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Iniciar sesión')}"></head>
<body>
<header th:replace="~{fragmentos :: menu}"></header>

<main class="contenedor contenedor--angosto">
    <section class="panel">
        <h1>Iniciar sesión</h1>
        <p class="subtitulo">Ingresa para ver el detalle completo de los eventos.</p>

        <div th:if="${param.error}" class="alerta alerta--error" role="alert">Usuario o contraseña incorrectos.</div>
        <div th:if="${param.bloqueado}" class="alerta alerta--error" role="alert">
            Demasiados intentos fallidos. Por seguridad, espera 15 minutos antes de volver a intentarlo.
        </div>
        <div th:if="${param.expirado}" class="alerta alerta--aviso" role="status">
            Tu sesión expiró. Inicia sesión nuevamente.
        </div>

        <!-- th:action agrega automáticamente el token CSRF oculto -->
        <form th:action="@{/login}" method="post" class="formulario" autocomplete="on">
            <div class="campo">
                <label for="username">Usuario</label>
                <input id="username" name="username" type="text" maxlength="50" required autofocus
                       autocomplete="username">
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" maxlength="100" required
                       autocomplete="current-password">
            </div>
            <button type="submit" class="boton boton--ancho">Entrar</button>
        </form>
    </section>
</main>

<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
