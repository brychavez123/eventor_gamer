spring.application.name=eventos-gamer-backend
server.port=8080

# --- Base de datos (MySQL en Docker). Las credenciales llegan por variables de entorno ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventos_gamer?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:eventos_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# --- JWT: el secreto NUNCA se escribe en el código; se entrega por variable de entorno ---
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracion-minutos=30
app.jwt.emisor=eventos-gamer-backend

# --- Subida de fotos y videos: límite de tamaño (fotos 5 MB y videos 20 MB se validan en ValidadorArchivos) ---
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# --- Endurecimiento (A05): sin detalles técnicos en errores ---
app.seguridad.endurecida=true
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
server.server-header=

# --- Registro de eventos de seguridad (A09) ---
logging.level.AUDITORIA=INFO
logging.level.org.springframework.security=WARN
