# Perfil SOLO para pruebas en el PC de desarrollo: base H2 en memoria con el mismo esquema y datos.
spring.datasource.url=jdbc:h2:mem:eventos_gamer;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
app.jwt.secret=${JWT_SECRET:clave-local-de-desarrollo-solo-pruebas-0123456789}
