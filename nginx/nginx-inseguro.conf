# Configuración INICIAL (sin endurecer). Solo para reproducir el escaneo ZAP "ANTES".
upstream frontend { server frontend:8081; }
upstream backend  { server backend:8080; }

client_max_body_size 21m;

server {
    listen 80 default_server;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;

    location = / { return 302 /eventos/; }
    location /eventos { proxy_pass http://frontend; }
    location = /login { proxy_pass http://backend; }
    location /api/ { proxy_pass http://backend; }
}
