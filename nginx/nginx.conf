# Proxy inverso: único punto de entrada (puertos 80 y 443).
#   https://[IP]/eventos  -> frontend (Spring Boot + Thymeleaf)
#   https://[IP]/api/...  -> backend  (API REST con JWT), para poder evaluarla con ZAP
#   https://[IP]/login    -> API de login del backend
#   http://[IP]/...       -> solo redirige a HTTPS (no se transmite nada sin cifrar, A02)
# La base de datos NO se publica hacia afuera.

server_tokens off;                      # no revelar la versión de nginx (A05)
client_max_body_size 1m;

# Solo los POST de login cuentan para el límite (freno a fuerza bruta, A07)
map $request_method $clave_login {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $clave_login zone=login:10m rate=10r/m;
limit_req_status 429;

upstream frontend { server frontend:8081; }
upstream backend  { server backend:8080; }

# Puerto 80: no entrega contenido, solo redirige a HTTPS (A02)
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;      # todo el sitio va por HTTPS (A02)
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # HSTS: el navegador usará siempre HTTPS durante 1 año (A02)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    proxy_hide_header Strict-Transport-Security;   # evita duplicar la que envía Spring

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_hide_header X-Powered-By;

    location = / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        return 302 /eventos/;
    }

    location = /eventos/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://frontend;
    }

    # Subida de fotos y videos: solo esta ruta acepta cuerpos grandes (el resto sigue con 1 MB)
    location ~ ^/eventos/evento/[0-9]+/medios$ {
        client_max_body_size 21m;
        proxy_pass http://frontend;
    }

    location /eventos {
        proxy_pass http://frontend;
    }

    location ~ ^/api/eventos/[0-9]+/medios$ {
        client_max_body_size 21m;
        proxy_pass http://backend;
    }

    location = /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend;
    }

    location /api/ {
        proxy_pass http://backend;
    }

    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        return 404;
    }
}
